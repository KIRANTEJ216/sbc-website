            - paragraph [ref=f12e54]: An accomplished engineer and senior corporate leader with over 35 years of experience, Shri. ILLA SOMA SEKHAR holds a B.E. in ECE and an M.Tech from JNTU, Hyderabad, complemented by advanced studies in HR, Psychology, Marketing, and Project Management.
            - paragraph [ref=f12e55]: He began his career at a small Hyderabad firm before joining a Navaratna PSU in 1990 as a Probationary Engineer, rising over three decades to the Senior Management position of Chief General Manager.
            - paragraph [ref=f12e56]: His lifelong commitment to community service through mentoring, career guidance, and personality development led to the founding of SB Connect on 26th January 2025 with 10 members. The initiative was formally inaugurated on 12th October 2025 with 60 members.
            - paragraph [ref=f12e57]: "His vision: unite SB community business professionals under a single platform that fosters mutual growth through collaboration, networking, and shared opportunities. He aims to establish similar groups across both Telugu states, each comprising 100 business members, to build a strong and influential societal presence."
